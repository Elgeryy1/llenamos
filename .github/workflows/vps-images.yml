name: Imágenes VPS
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r lint && pnpm -r typecheck && pnpm -r test
      - run: sh apps/api/scripts/test-postgres-docker.sh
      - run: node deploy/vps/nginx-security.test.mjs
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: names
        shell: bash
        run: echo "repository=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: web
        with:
          context: .
          file: deploy/vps/Dockerfile
          target: web
          push: true
          tags: ghcr.io/${{ steps.names.outputs.repository }}-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
            NEXT_PUBLIC_FIREBASE_API_KEY=${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
            NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ vars.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
            NEXT_PUBLIC_FIREBASE_APP_ID=${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_DATA_BACKEND=postgres
            VITE_APP_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: gateway
        with:
          context: .
          file: deploy/vps/Dockerfile
          target: gateway
          push: true
          tags: ghcr.io/${{ steps.names.outputs.repository }}-gateway:${{ github.sha }}
          cache-from: type=gha
          build-args: |
            NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
            NEXT_PUBLIC_FIREBASE_API_KEY=${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
            NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ vars.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
            NEXT_PUBLIC_FIREBASE_APP_ID=${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_DATA_BACKEND=postgres
            VITE_APP_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: api
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.names.outputs.repository }}-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: backup
        with:
          context: deploy/vps/backup
          file: deploy/vps/backup/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.names.outputs.repository }}-backup:${{ github.sha }}
      - name: Referencias inmutables de la release
        env:
          WEB: ghcr.io/${{ steps.names.outputs.repository }}-web@${{ steps.web.outputs.digest }}
          GATEWAY: ghcr.io/${{ steps.names.outputs.repository }}-gateway@${{ steps.gateway.outputs.digest }}
          API: ghcr.io/${{ steps.names.outputs.repository }}-api@${{ steps.api.outputs.digest }}
          BACKUP: ghcr.io/${{ steps.names.outputs.repository }}-backup@${{ steps.backup.outputs.digest }}
        run: |
          printf 'WEB_IMAGE=%s\nGATEWAY_IMAGE=%s\nAPI_IMAGE=%s\nBACKUP_IMAGE=%s\n' "$WEB" "$GATEWAY" "$API" "$BACKUP" > release.env
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vps-release-${{ github.sha }}
          path: release.env
