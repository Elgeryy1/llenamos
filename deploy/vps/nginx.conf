# Contrato de red: solo cloudflared (172.30.42.2) y gateway están en tunnel_edge.
# Comprobar antes de desplegar que 172.30.42.0/28 no colisiona con rutas/redes existentes.
# No ampliar a 0.0.0.0/0 ni confiar en cabeceras recibidas desde el puerto de loopback.
set_real_ip_from 172.30.42.2/32;
real_ip_header CF-Connecting-IP;
real_ip_recursive off;

# La IP de la conexión original identifica al túnel, incluso tras aplicar real_ip.
map "$realip_remote_addr:$http_x_forwarded_proto" $external_hsts {
  default "";
  "172.30.42.2:https" "max-age=31536000";
}
map "$realip_remote_addr:$http_x_forwarded_proto" $upstream_scheme {
  default $scheme;
  "172.30.42.2:https" https;
}

# Los enlaces privados pueden llevar secretos tanto en el path como en la query.
# Solo registrar familias conocidas: nunca request, request_uri, args ni referer.
map $uri $log_route {
  default other;
  ~^/r(?:/|$) reservation;
  ~^/m(?:/|$) table;
  ~^/p(?:/|$) payment;
  ~^/recibo(?:/|$) receipt;
  ~^/baja(?:/|$) unsubscribe;
  ~^/widget(?:/|$) widget;
  ~^/panel(?:/|$) panel;
  ~^/logiqd(?:/|$) administration;
  ~^/entrar(?:/|$) login;
  ~^/(?:api|v1)(?:/|$) api;
  ~^/_next/static/ asset;
}
log_format private_access '$remote_addr [$time_local] "$request_method $log_route" '
                          '$status $body_bytes_sent $request_time';
# error_log no admite un formato sanitizado y puede añadir la URL original.
# Los errores se observan por access/status y logs estructurados del servidor, sin URL privada.

map $uri $rate_limit_key {
  ~^/_next/static/ "";
  default $binary_remote_addr;
}
# Por IP pública. Un restaurante saca por la misma IP todos sus móviles, pantallas de cocina y caja, y el panel precarga
# páginas y mantiene conexiones en vivo: 20r/s con ráfaga de 100 cortaba (429) a un solo usuario con varias pestañas; ahora 500r/s con ráfaga de 1000.
limit_req_zone $rate_limit_key zone=web:10m rate=500r/s;
limit_req_status 429;
limit_conn_zone $binary_remote_addr zone=live_per_ip:5m;

map $uri $app_cache_control {
  ~^/_next/static/ "public, max-age=31536000, immutable";
  # Fotos públicas de la carta: inmutables por ID, sin datos privados.
  ~^(?:/api)?/v1/public/files/ "public, max-age=300";
  default "private, no-store, max-age=0";
}
map $uri $app_frame_options {
  ~^/widget(?:/|$) "";
  default DENY;
}
# connect-src: la web solo habla con su API (mismo origen) y con las dos direcciones de Firebase Auth (identitytoolkit y securetoken) (login por contraseña).
# Firestore, Functions y Storage quedan bloqueados en el navegador aunque se cuele código que los use.
map $uri $app_csp {
  ~^/widget(?:/|$) "frame-ancestors *; object-src 'none'; base-uri 'self'; connect-src 'self' https://identitytoolkit.googleapis.com https://securetoken.googleapis.com";
  default "frame-ancestors 'none'; object-src 'none'; base-uri 'self'; connect-src 'self' https://identitytoolkit.googleapis.com https://securetoken.googleapis.com";
}
server {
  listen 8080;
  server_name _;
  access_log /dev/stdout private_access;
  error_log /dev/null crit;
  root /usr/share/nginx/html;
  server_tokens off;
  client_max_body_size 10m;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Strict-Transport-Security $external_hsts always;
  add_header X-Frame-Options DENY always;
  add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
  location = /healthz { access_log off; return 200 'ok'; }
  location / { try_files $uri $uri/ /index.html; }
}
server {
  listen 8081;
  server_name _;
  access_log /dev/stdout private_access;
  error_log /dev/null crit;
  server_tokens off;
  client_max_body_size 10m;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Strict-Transport-Security $external_hsts always;
  add_header X-Frame-Options $app_frame_options always;
  # CSP parcial: no declara script-src ni bloquea el inline de Next sin un nonce.
  add_header Content-Security-Policy $app_csp always;
  add_header Cache-Control $app_cache_control always;
  # Lecturas en vivo (SSE): conexiones largas, acotadas por IP además del límite de la API.
  location ^~ /api/v1/live/ {
    limit_req zone=web burst=1000 nodelay;
    limit_conn live_per_ip 24;
    limit_conn_status 429;
    client_max_body_size 64k;
    # Resolver en cada conexión evita arrancar una API no migrada al servir solo la landing.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_origin http://api:3100;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $api_origin;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $upstream_scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_hide_header Cache-Control;
    proxy_hide_header Referrer-Policy;
    proxy_buffering off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 75s;
  }
  # Subida de archivos privados: la API aplica los límites por propósito (hasta 8 MiB).
  location ~ ^/api/v1/restaurants/[A-Za-z0-9_-]+/files(?:/[0-9a-f-]+)?$ {
    limit_req zone=web burst=1000 nodelay;
    client_max_body_size 9m;
    proxy_request_buffering off;
    # Resolver en cada conexión evita arrancar una API no migrada al servir solo la landing.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_origin http://api:3100;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $api_origin;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $upstream_scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_hide_header Cache-Control;
    proxy_hide_header Referrer-Policy;
    proxy_buffering off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
  }
  # Webhooks de proveedores (Stripe, WhatsApp): cuerpo crudo firmado, hasta 256 KB.
  location ~ ^/api/v1/webhooks/(?:stripe|whatsapp)/[A-Za-z0-9_-]+$ {
    limit_req zone=web burst=1000 nodelay;
    client_max_body_size 256k;
    # Resolver en cada conexión evita arrancar una API no migrada al servir solo la landing.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_origin http://api:3100;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $api_origin;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $upstream_scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_hide_header Cache-Control;
    proxy_hide_header Referrer-Policy;
    proxy_buffering off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
  }
  location /api/ {
    limit_req zone=web burst=1000 nodelay;
    client_max_body_size 64k;
    # Resolver en cada conexión evita arrancar una API no migrada al servir solo la landing.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_origin http://api:3100;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $api_origin;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $upstream_scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_hide_header Cache-Control;
    proxy_hide_header Referrer-Policy;
    proxy_buffering off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
  }
  location / {
    limit_req zone=web burst=1000 nodelay;
    proxy_pass http://web:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $upstream_scheme;
    # Sobrescribir, no concatenar la cadena X-Forwarded-For aportada por un cliente.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_hide_header Cache-Control;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Content-Security-Policy;
    proxy_buffering off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 90s;
  }
}
